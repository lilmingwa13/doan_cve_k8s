# The observation adapter may leave the GitHub MCP workload only for the
# in-namespace sink and DNS.  This is a declared measurement boundary, not an
# application fix for its process-global credential state.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-mcp-observer-egress
  namespace: ai-cve-lab-exposed
spec:
  podSelector:
    matchLabels: { app: github-mcp-exposed }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: github-credential-sink }
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
